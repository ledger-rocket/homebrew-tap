# The bump lives here rather than in rocket-review's publish workflow on purpose:
# that repo's CI is deliberately secretless (contents: read, trusted-publishing OIDC,
# fork-PR safety as a design property), and pushing across repos would need a PAT
# there. The sdist sha256 also does not exist until after its publish job finishes.
name: Bump on new PyPI release

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Push only. Opening the PR from here would need *Allow GitHub Actions to create and
# approve pull requests*, a single toggle that also grants approval — too much standing
# authority for a version bump, in a repository where a merged formula runs code on
# other people's machines.
#
# `contents: write` is still real authority: on its own it permits pushing to any
# unprotected ref and calling the merge endpoint. What stops it reaching `main` here is
# the branch ruleset (pull request + `CI Success` required, and this token is not a
# bypass actor), not the permission block. Dropping `pull-requests: write` narrows what
# this job can do; it does not make it harmless.
permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Compare PyPI against the formula
        id: check
        run: |
          set -euo pipefail
          meta=$(curl -fsSL https://pypi.org/pypi/rocket-review/json)
          latest=$(jq -r '.info.version' <<<"$meta")
          current=$(sed -n 's|.*/rocket_review-\(.*\)\.tar\.gz"|\1|p' Formula/rocket-review.rb)
          echo "latest=$latest"   >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # The sdist, not the wheel: the formula builds from source.
            jq -r --arg v "$latest" \
              '.releases[$v][] | select(.packagetype=="sdist") | .url, .digests.sha256' \
              <<<"$meta" > /tmp/sdist
            { echo "url=$(sed -n 1p /tmp/sdist)"; echo "sha=$(sed -n 2p /tmp/sdist)"; } \
              >> "$GITHUB_OUTPUT"
          fi

      - name: Rewrite the formula
        if: steps.check.outputs.changed == 'true'
        env:
          URL: ${{ steps.check.outputs.url }}
          SHA: ${{ steps.check.outputs.sha }}
        run: scripts/rewrite-formula.sh Formula/rocket-review.rb "$URL" "$SHA"

      - name: Push the bump branch
        if: steps.check.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
          CURRENT: ${{ steps.check.outputs.current }}
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          set -euo pipefail
          branch="bump/rocket-review-$LATEST"
          repo="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          link="${repo}/compare/main...${branch}?expand=1"

          # `--exit-code` reports 2 for "no such ref" and 128 for transport or auth
          # failures. Reading anything non-zero as "absent" would turn a network blip into
          # a confusing push failure a step later, so only 2 means absent.
          set +e
          git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>"$RUNNER_TEMP/ls.err"
          rc=$?
          set -e
          case "$rc" in
            0) exists=true ;;
            2) exists=false ;;
            *) echo "git ls-remote failed (exit $rc):" >&2; cat "$RUNNER_TEMP/ls.err" >&2
               exit 1 ;;
          esac

          if [ "$exists" = true ]; then
            # A re-run after a partial failure finds its own branch already there.
            # Committing again would produce a different oid for identical content and the
            # push would be refused, so it is left alone — but only after checking it
            # really carries this release, since the name alone proves nothing about the
            # sha256 a reviewer would then be asked to merge.
            git fetch -q origin "$branch"
            if ! git show "origin/$branch:Formula/rocket-review.rb" \
                 | grep -qF "  sha256 \"$SHA\""; then
              echo "branch $branch exists but does not carry sha256 $SHA — refusing to" \
                   "advertise it as this bump; delete it or inspect it by hand" >&2
              exit 1
            fi
            echo "branch $branch already carries $LATEST — leaving it alone" >&2
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$branch"
            git commit -qam "rocket-review $LATEST"
            git push -q -u origin "$branch"
          fi

          {
            echo "## rocket-review \`$CURRENT\` → \`$LATEST\`"
            echo
            echo "Formula bumped on \`$branch\`; url and sha256 read from the PyPI sdist."
            echo
            echo "**[Open the pull request]($link)**"
            echo
            echo "A human-opened PR starts CI on its own; one opened by"
            echo "\`GITHUB_TOKEN\` would not."
          } >> "$GITHUB_STEP_SUMMARY"
