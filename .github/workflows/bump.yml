# The bump lives here rather than in rocket-review's publish workflow on purpose:
# that repo's CI is deliberately secretless (contents: read, trusted-publishing OIDC,
# fork-PR safety as a design property), and pushing across repos would need a PAT
# there. The sdist sha256 also does not exist until after its publish job finishes.
name: Bump on new PyPI release

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Push only. Opening the PR from here would need *Allow GitHub Actions to create and
# approve pull requests*, a single toggle that also grants approval — too much standing
# authority for a version bump, in a repository where a merged formula runs code on
# other people's machines.
permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Compare PyPI against the formula
        id: check
        run: |
          set -euo pipefail
          meta=$(curl -fsSL https://pypi.org/pypi/rocket-review/json)
          latest=$(jq -r '.info.version' <<<"$meta")
          current=$(sed -n 's|.*/rocket_review-\(.*\)\.tar\.gz"|\1|p' Formula/rocket-review.rb)
          echo "latest=$latest"   >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # The sdist, not the wheel: the formula builds from source.
            jq -r --arg v "$latest" \
              '.releases[$v][] | select(.packagetype=="sdist") | .url, .digests.sha256' \
              <<<"$meta" > /tmp/sdist
            { echo "url=$(sed -n 1p /tmp/sdist)"; echo "sha=$(sed -n 2p /tmp/sdist)"; } \
              >> "$GITHUB_OUTPUT"
          fi

      - name: Rewrite the formula
        if: steps.check.outputs.changed == 'true'
        env:
          URL: ${{ steps.check.outputs.url }}
          SHA: ${{ steps.check.outputs.sha }}
        run: scripts/rewrite-formula.sh Formula/rocket-review.rb "$URL" "$SHA"

      - name: Push the bump branch
        if: steps.check.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
          CURRENT: ${{ steps.check.outputs.current }}
        run: |
          set -euo pipefail
          branch="bump/rocket-review-$LATEST"
          repo="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          link="${repo}/compare/main...${branch}?expand=1"

          # A re-run after a partial failure finds its own branch already there. Committing
          # again would produce a different oid for identical content and the push would be
          # refused as a non-fast-forward, so the branch is left alone and reported instead.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "branch $branch already exists — leaving it alone" >&2
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$branch"
            git commit -qam "rocket-review $LATEST"
            git push -q -u origin "$branch"
          fi

          {
            echo "## rocket-review \`$CURRENT\` → \`$LATEST\`"
            echo
            echo "Formula bumped on \`$branch\`; url and sha256 read from the PyPI sdist."
            echo
            echo "**[Open the pull request]($link)**"
            echo
            echo "A human-opened PR starts CI on its own; one opened by"
            echo "\`GITHUB_TOKEN\` would not."
          } >> "$GITHUB_STEP_SUMMARY"
